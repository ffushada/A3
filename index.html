<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Luxury</title>

    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="site-header">
        <div class="header-left">
            <button class="icon-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu-icon lucide-menu"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>            </button>
        </div>

        <div class="header-middle">
            <button class="logo">rugged luxury</button>
        </div>
        
        <div class="header-right">
            <button class="icon-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart-icon lucide-shopping-cart"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
            </button>

            <button class="icon-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            </button>
        </div>

    </header>

    <main>

        <section class="hero">
            <div class="big-logo">Rugged Luxury</div>
            <button class="shop-button">Shop All</button>
        </section>

        <section class="story">
            <h2>Built to last. Designed to travel.</h2>
            <h3>Australian made, premium quality to last a lifetime.</h3>
            <button>Our Story</button>
        </section>

        <section class="categories">
            <button class="category-card">Leather Bags</button>
            <button class="category-card">Leather Accessories</button>
            <button class="category-card">Leather Belts</button>
            <button class="category-card">Leather Care</button>
        </section>
    </main>

    <footer>
        <div class="footer-icons">icons</div>
        <p>© 2026, Rugged Luxury</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
