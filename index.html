<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Luxury</title>

    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="site-header">
        <button class="icon-button">menu</button>
        <button class="logo">rugged luxury</button>
        <button class="icon-button">cart</button>
        <button class="icon-button">search</button>
    </header>

    <main>

        <section class="hero">
            <div class="big-logo">Rugged Luxury</div>
            <button>Shop All</button>
        </section>

        <section class="story">
            <h2>Built to last. Designed to travel.</h2>
            <h3>Australian made, premium quality to last a lifetime.</h3>
            <button>Our Story</button>
        </section>

        <section class="categories">
            <button class="category-card">Leather Bags</button>
            <button class="category-card">Leather Accessories</button>
            <button class="category-card">Leather Belts</button>
            <button class="category-card">Leather Care</button>
        </section>
    </main>

    <footer>
        <div class="footer-icons">icons</div>
        <p>© 2026, Rugged Luxury</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
